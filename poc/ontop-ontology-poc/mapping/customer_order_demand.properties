# Ontop JDBC connection for the customer_order_demand POC.
#
# This file is for MANUAL `ontop query` runs from the repository root.
# It points at the DuckDB database materialized by `cd Utilities/SQLMesh && sqlmesh run`.
#
# NOTE: Tables live in the `mfg_data` schema inside DuckDB.  Unqualified
# table references in the OBDA mapping resolve correctly when DuckDB's
# search_path includes `mfg_data`.  Set it either via the Ontop custom
# connection-arg or by aliasing views in the main schema.
#
# The automated parity checks do NOT use this file; they export a SQLite
# snapshot from the DuckDB source and point Ontop at the snapshot, so
# the live DuckDB database is never opened for writing.  See README.md.
jdbc.url=jdbc:duckdb:Utilities/SQLMesh/db.db
jdbc.driver=org.duckdb.DuckDBDriver
